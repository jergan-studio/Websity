name: Build and Release Websity Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Websity
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
          mkdir build
          mkdir dist
          javac -d build src\main\java\App.java

      - name: Create JAR
        shell: cmd
        run: |
          jar --create --file dist\Websity.jar --main-class App -C build .

      - name: Create Windows application image
        shell: cmd
        run: |
          mkdir dist\app-input
          xcopy /E /I /Y web dist\app-input\web
          copy /Y dist\Websity.jar dist\app-input\Websity.jar
          jpackage ^
            --type app-image ^
            --name Websity ^
            --input dist\app-input ^
            --main-jar Websity.jar ^
            --main-class App ^
            --dest dist ^
            --app-version 1.0.0 ^
            --add-modules jdk.httpserver

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path dist\Websity\* -DestinationPath dist\Websity-Portable.zip -Force

      - name: Create Windows MSI installer
        shell: cmd
        run: |
          jpackage ^
            --type msi ^
            --name Websity ^
            --input dist\app-input ^
            --main-jar Websity.jar ^
            --main-class App ^
            --dest dist ^
            --app-version 1.0.0 ^
            --add-modules jdk.httpserver ^
            --win-dir-chooser ^
            --win-menu ^
            --win-shortcut

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Websity-JAR
          path: dist/Websity.jar
          if-no-files-found: error

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Websity-Portable
          path: dist/Websity-Portable.zip
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Websity-Windows-Installer
          path: dist/Websity-1.0.0.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Websity Latest
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            dist/Websity-1.0.0.msi
            dist/Websity-Portable.zip
            dist/Websity.jar
